name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Check
        run: ./gradlew check --no-daemon
        env: { GRADLE_USER_HOME: /tmp/gh }
