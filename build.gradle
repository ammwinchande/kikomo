plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'co.tz.kikomo'
version = '1.0.0'

java { sourceCompatibility = '21' }

repositories { mavenCentral() }

ext {
    springAiVersion = '2.0.2'
}

dependencyManagement {
    imports { mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}" }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

tasks.register('runSpike', JavaExec) {
    group = 'verification'; description = 'PayPal sandbox spike (mock-safe)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'co.tz.kikomo.spike.SpikeMain'
}
tasks.register('frontendInstall', Exec) {
    group = 'build'; description = 'Install the locked frontend dependencies (requires Node.js and npm)'
    workingDir file('src/frontend')
    commandLine 'npm', 'ci', '--no-audit', '--no-fund'
    inputs.files('src/frontend/package.json', 'src/frontend/package-lock.json')
    outputs.dir('src/frontend/node_modules')
}
tasks.register('frontendTest', Exec) {
    group = 'verification'; description = 'Typecheck + Vitest for the React SPA'
    dependsOn 'frontendInstall'
    workingDir file('src/frontend')
    commandLine 'sh', '-c', 'npm run typecheck && npm test'
    outputs.upToDateWhen { false }
}
tasks.register('frontendBuild', Exec) {
    group = 'build'; description = 'Build the React SPA'
    dependsOn 'frontendInstall'
    workingDir file('src/frontend')
    commandLine 'npm', 'run', 'build'
    inputs.files(fileTree('src/frontend') { exclude 'node_modules/**', 'dist/**' })
    outputs.dir('src/frontend/dist')
}
tasks.named('check') { dependsOn 'frontendTest' }
tasks.register('copyFrontend', Sync) {
    dependsOn 'frontendBuild'
    from('src/frontend/dist'); into('src/main/resources/static')
    doFirst {
        if (!file('src/frontend/dist/index.html').isFile()) {
            throw new GradleException('Frontend output is missing; run frontendBuild before packaging.')
        }
    }
}
tasks.named('processResources') { dependsOn 'copyFrontend' }
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-parameters'] }
